# GoReleaser config for neo (ADR-002: single static binary + co-located lib/).
# Release with: git tag v0.1.0 && git push origin v0.1.0
# (release.yml builds these; archives bundle neo/lib/ templates).
version: 2

project_name: neo

before:
  hooks:
    - go mod tidy

builds:
  - id: neo
    main: .
    binary: neo
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: [-s -w -X main.version={{.Version}}]

archives:
  - id: neo
    name_template: "neo_{{.Version}}_{{.Os}}_{{.Arch}}"
    formats: [tar.gz]
    files:
      - neo/lib/*

checksum:
  name_template: checksums.txt

# Homebrew tap — DISABLED until github.com/mamersfo/homebrew-tap exists.
# To re-enable: uncomment, create the tap repo, and set HOMEBREW_TAP_GITHUB_TOKEN
